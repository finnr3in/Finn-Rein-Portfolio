<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Title</title>
<!--
  Projektseite. Ab hier gilt die eigene Gestaltung des Projekts: Schrift, Farben, Aufbau frei wählbar.
  Der Hub öffnet diese Datei in der Kartei und legt nur den orangen Seitenstreifen links daneben.

  Einzige Regel: Jedes Kapitel ist ein Element mit data-chapter="Name".
  Daraus baut der Hub die Kapitel-Navigation im Seitenstreifen.
  Bilder, CSS, Schriften: einfach in diesen Ordner legen und relativ verlinken (z. B. src="img/model.jpg").
-->
<style>
  :root{ --bg:#f2f2f0; --fg:#1a1a1a; --acc:#1a1a1a; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:Arial, sans-serif }
  .wrap{ max-width:1000px; margin:0 auto; padding:clamp(32px,6vw,72px) 16px 96px clamp(16px,5vw,64px) }
  .kicker{ margin:0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.7 }
  h1{ font-size:clamp(44px,10vw,128px); line-height:.88; margin:.18em 0 .22em; letter-spacing:-.02em }
  .lede{ font-size:clamp(18px,2.2vw,24px); line-height:1.35; max-width:36ch; margin:0 }
  section{ margin-top:clamp(48px,7vw,88px); border-top:1px solid color-mix(in srgb,var(--fg) 25%,transparent); padding-top:18px }
  section h2{ font-size:clamp(24px,3.2vw,38px); margin:0 0 10px; line-height:1 }
  section p{ line-height:1.55; max-width:60ch }
  img{ max-width:100%; display:block }
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Project</p>
  <h1>Project Title</h1>
  <p class="lede">One sentence on what this is.</p>

  <section data-chapter="Problem">
    <h2>Problem</h2>
    <p>Text, drawings, photos, models.</p>
  </section>

  <section data-chapter="Process">
    <h2>Process</h2>
    <p>…</p>
  </section>

  <section data-chapter="Result">
    <h2>Result</h2>
    <p>…</p>
  </section>
</main>
</body>
</html>
